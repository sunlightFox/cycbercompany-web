services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-agent-studio-web
    ports:
      - "5173:5173"
      - "5174:5173"
      # The backend shares this network namespace. Expose it only to the host
      # so the local node client can use the same API as the browser.
      - "127.0.0.1:8083:8080"
    environment:
      VITE_DEV_PROXY_TARGET: http://127.0.0.1:8080
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - |
        lock_hash=$$(sha256sum package-lock.json | awk '{print $$1}')
        if [ ! -x node_modules/.bin/vite ] || [ "$$(cat node_modules/.package-lock.sha256 2>/dev/null)" != "$$lock_hash" ]; then
          npm ci
          printf '%s' "$$lock_hash" > node_modules/.package-lock.sha256
        fi
        backend_wait_seconds=0
        until wget -qO- http://127.0.0.1:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; do
          backend_wait_seconds=$$((backend_wait_seconds + 1))
          if [ "$$backend_wait_seconds" -ge 180 ]; then
            echo "Backend did not become healthy within 180 seconds; starting Vite in offline mode."
            break
          fi
          sleep 1
        done
        exec npm run dev -- --host 0.0.0.0 --port 5173
    restart: unless-stopped

  backend:
    build:
      context: ../spring-agent-studio-backend
      dockerfile: Dockerfile.dev
    container_name: spring-agent-studio-backend
    environment:
      # Docker port forwarding enters the shared namespace via its container
      # interface. The published 8083 port is host-loopback-only; the explicit
      # flag below is required by the backend's LOCAL-mode safety gate.
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      APP_SECURITY_MODE: LOCAL
      APP_SECURITY_ALLOW_LOCAL_PROXY: "true"
      # This shared interactive backend must remain personal-local. Dedicated
      # evaluation deployments opt in explicitly in their own compose file.
      APP_EXECUTION_ALLOW_NODES_ONLY: "false"
      # Enable browser-based verification of this host's locally served development apps.
      # Production keeps the backend default of rejecting all private browser targets.
      APP_NODES_BROWSER_ALLOWED_PRIVATE_HOSTS: "127.0.0.1,localhost"
      # Keep the container's development state isolated from a host-side backend.
      # H2 file databases are single-writer; sharing /workspace/data can corrupt it.
      APP_DATA_DIR: /workspace/.runtime-data
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EDGEFN_API_KEY: ${EDGEFN_API_KEY:-}
      GRADLE_USER_HOME: /home/gradle/.gradle
    volumes:
      - ../spring-agent-studio-backend:/workspace
      - backend_build:/workspace/build
      - backend_project_gradle:/workspace/.gradle
      - backend_gradle_cache:/home/gradle/.gradle
    command: ["sh", "./gradlew", "bootRun", "--no-daemon"]
    network_mode: service:web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    restart: unless-stopped

volumes:
  web_node_modules:
  backend_build:
  backend_project_gradle:
  backend_gradle_cache:
